apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP # Internal cluster routing
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: TCP
      port: 80        # Port the service listens on
      targetPort: 8000 # Port your FastAPI application is running on